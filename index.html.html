<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>DINO 3D — Desert Runner</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#111;
  font-family:'Courier New',Courier,monospace;user-select:none;
  -webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#c{display:block;position:fixed;inset:0;width:100%;height:100%}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;padding:12px 20px;
  display:flex;justify-content:space-between;align-items:flex-start;
  pointer-events:none;z-index:20}
.hcol{display:flex;flex-direction:column;gap:1px}
.hcol.r{align-items:flex-end}
.hlbl{font-size:9px;letter-spacing:3px;color:rgba(255,255,255,.38)}
.hval{font-size:30px;font-weight:900;letter-spacing:3px;color:#fff;
  text-shadow:0 0 14px rgba(255,255,255,.45);line-height:1}
#coins-hud-wrap{display:flex;flex-direction:column;align-items:center;gap:1px}
#coins-hud{font-size:26px;font-weight:900;letter-spacing:2px;color:#FFD700;
  text-shadow:0 0 14px #FFD700;line-height:1}

/* pause button */
#btn-pause{position:fixed;top:12px;right:50%;transform:translateX(50%);
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  color:#fff;font-size:18px;width:38px;height:38px;border-radius:50%;
  cursor:pointer;z-index:25;display:none;line-height:1;padding:0}
#btn-pause:hover{background:rgba(255,255,255,.22)}

/* TOD & weather bars */
#tod-bar{position:fixed;top:0;left:0;right:0;height:3px;
  background:rgba(255,255,255,.08);pointer-events:none;z-index:21}
#tod-fill{height:100%;width:0%;border-radius:0 2px 2px 0;transition:background .5s}
#tod{position:fixed;top:16px;left:50%;transform:translateX(-50%);
  font-size:10px;letter-spacing:3px;color:rgba(255,255,255,.4);
  pointer-events:none;z-index:20;margin-top:14px}
#weather-lbl{position:fixed;top:36px;left:50%;transform:translateX(-50%);
  font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.5);
  pointer-events:none;z-index:20;text-shadow:0 0 8px rgba(255,200,100,.5)}

/* Screens */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  z-index:30;opacity:0;pointer-events:none;transition:opacity .3s}
.screen.on{opacity:1;pointer-events:all}
.screen-bg{background:radial-gradient(ellipse at 50% 55%,rgba(15,8,30,.6) 0%,rgba(4,2,12,.92) 100%)}
.si{display:flex;flex-direction:column;align-items:center;gap:16px;
  max-height:90vh;overflow-y:auto;padding:10px 0}

/* Logo */
.logo{display:flex;align-items:baseline;gap:2px;line-height:1;flex-wrap:nowrap}
.logo span{font-size:clamp(44px,8vw,96px);font-weight:900;letter-spacing:5px;
  color:#fff;text-shadow:0 0 28px #7fff60,0 0 55px rgba(100,255,60,.35);
  display:inline-block;animation:pop .6s ease both}
.logo .d{animation-delay:.05s}.logo .i{animation-delay:.11s}
.logo .n{animation-delay:.17s}.logo .o{animation-delay:.23s}
.logo .td{font-size:clamp(22px,3.5vw,46px)!important;color:#7fff60!important;
  text-shadow:0 0 18px #7fff60!important;letter-spacing:2px!important;margin-left:6px;animation-delay:.3s}
@keyframes pop{0%{opacity:0;transform:translateY(-16px) scale(.78)}70%{transform:translateY(3px) scale(1.05)}100%{opacity:1;transform:none}}
.tagline{font-size:11px;letter-spacing:6px;color:rgba(180,255,120,.45);margin-top:-10px}

/* Buttons */
.btn{padding:13px 40px;font-size:13px;letter-spacing:4px;font-family:inherit;
  font-weight:700;color:#fff;border:none;border-radius:6px;cursor:pointer;
  transition:transform .12s,box-shadow .12s;-webkit-appearance:none;white-space:nowrap}
.btn:hover,.btn:focus{transform:translateY(-2px);outline:none}
.btn:active{transform:none}
.btn-green{background:linear-gradient(135deg,#3a9a20,#1a6010);
  box-shadow:0 0 24px rgba(80,200,40,.4),0 4px 16px rgba(0,0,0,.5)}
.btn-green:hover{box-shadow:0 0 38px rgba(80,200,40,.58),0 8px 24px rgba(0,0,0,.55)}
.btn-gray{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);
  box-shadow:0 2px 10px rgba(0,0,0,.4)}
.btn-gray:hover{background:rgba(255,255,255,.2)}
.btn-gold{background:linear-gradient(135deg,#c9900a,#8a6000);
  box-shadow:0 0 22px rgba(255,200,0,.35),0 4px 14px rgba(0,0,0,.5)}
.btn-gold:hover{box-shadow:0 0 36px rgba(255,200,0,.5)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.hint{display:flex;flex-direction:column;align-items:center;gap:5px;
  font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.18)}

/* Game Over */
.over-title{font-size:clamp(30px,6vw,66px);font-weight:900;
  letter-spacing:7px;color:#7fff60;text-shadow:0 0 26px #7fff60}
.sblock{display:flex;flex-direction:column;align-items:center;gap:3px}
.slbl{font-size:10px;letter-spacing:3px;color:rgba(180,255,120,.5)}
.slbl.gold{color:#ffd700;text-shadow:0 0 12px #ffd70080;font-size:13px}
#over-val{font-size:46px;font-weight:900;letter-spacing:4px;color:#fff;
  text-shadow:0 0 18px #ffd700,0 0 36px rgba(255,215,0,.28)}
#over-coins{font-size:18px;letter-spacing:2px;color:#FFD700;
  text-shadow:0 0 10px #FFD700}

/* Pause screen */
.pause-title{font-size:clamp(28px,5vw,58px);font-weight:900;
  letter-spacing:6px;color:#fff;text-shadow:0 0 20px rgba(255,255,255,.5)}

/* Shop */
#scr-shop{z-index:40;align-items:flex-start;justify-content:center;padding-top:0}
#scr-shop .si{width:100%;max-width:600px;padding:16px 12px}
.shop-header{display:flex;align-items:center;justify-content:space-between;
  width:100%;margin-bottom:4px}
.shop-title{font-size:22px;font-weight:900;letter-spacing:5px;color:#FFD700;
  text-shadow:0 0 16px #FFD700}
.shop-bal{font-size:14px;letter-spacing:2px;color:#FFD700}
.shop-section{width:100%;margin-bottom:12px}
.shop-sec-title{font-size:11px;letter-spacing:4px;color:rgba(255,255,255,.45);
  margin-bottom:8px;padding-left:2px}
.shop-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start}
.shop-item{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  border-radius:8px;padding:10px 12px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  min-width:90px;flex:1;max-width:130px;
  transition:background .15s,border-color .15s,transform .12s}
.shop-item:hover{background:rgba(255,255,255,.14);transform:translateY(-2px)}
.shop-item.active{border-color:#7fff60;background:rgba(100,255,60,.12)}
.shop-item.locked{opacity:.5}
.si-preview{width:36px;height:36px;border-radius:6px;border:2px solid rgba(255,255,255,.2)}
.si-canvas{width:72px;height:72px;border-radius:6px;border:1px solid rgba(255,255,255,.15);display:block}
.si-hat-icon{font-size:26px;line-height:1}
.si-name,.si-hat-name{font-size:10px;letter-spacing:1px;color:#fff;text-align:center}
.si-price{font-size:9px;letter-spacing:1px;color:#FFD700;text-align:center}
#shop-items{width:100%;overflow-y:auto;max-height:calc(100vh - 130px)}

@media(max-width:480px){
  .hval{font-size:22px}#hud{padding:8px 12px}
  .btn{padding:11px 28px;font-size:12px;letter-spacing:3px}
  .shop-item{min-width:75px;padding:8px 8px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="hcol">
    <span class="hlbl">СЧЁТ</span>
    <span class="hval" id="score">00000</span>
  </div>
  <div class="hcol" id="coins-hud-wrap">
    <span class="hlbl">МОНЕТЫ</span>
    <span id="coins-hud">0</span>
  </div>
  <div class="hcol r">
    <span class="hlbl">РЕКОРД</span>
    <span class="hval" id="hi">00000</span>
  </div>
</div>

<button id="btn-pause">⏸</button>
<div id="tod-bar"><div id="tod-fill"></div></div>
<div id="tod">УТРО</div>
<div id="weather-lbl">ЯСНО</div>

<!-- START SCREEN -->
<div class="screen screen-bg on" id="scr-start">
  <div class="si">
    <div class="logo">
      <span class="d">D</span><span class="i">I</span><span class="n">N</span><span class="o">O</span><span class="td">3D</span>
    </div>
    <p class="tagline">DESERT RUNNER</p>
    <div class="btn-row">
      <button class="btn btn-green" id="btn-start">&#9654; ИГРАТЬ</button>
      <button class="btn btn-gold" id="btn-shop">🏪 МАГАЗИН</button>
    </div>
    <div class="hint">
      <span>ПРОБЕЛ / ↑ — ПРЫЖОК &nbsp;|&nbsp; ESC / P — ПАУЗА</span>
      <span>📱 ТАП — ПРЫЖОК</span>
    </div>
  </div>
</div>

<!-- PAUSE SCREEN -->
<div class="screen screen-bg" id="scr-pause">
  <div class="si">
    <div class="pause-title">⏸ ПАУЗА</div>
    <div class="btn-row">
      <button class="btn btn-green" id="btn-resume">▶ ПРОДОЛЖИТЬ</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-gold" id="btn-shop-pause">🏪 МАГАЗИН</button>
      <button class="btn btn-gray" id="btn-menu-from-pause">⏹ В МЕНЮ</button>
    </div>
    <div class="hint"><span>ESC / P — продолжить</span></div>
  </div>
</div>

<!-- GAME OVER SCREEN -->
<div class="screen screen-bg" id="scr-over">
  <div class="si">
    <div class="over-title">GAME OVER</div>
    <div class="sblock">
      <span class="slbl">СЧЁТ</span>
      <span id="over-val">00000</span>
    </div>
    <div class="sblock">
      <span id="over-coins">+0 монет</span>
    </div>
    <div class="sblock" id="new-rec" style="display:none">
      <span class="slbl gold">🏆 НОВЫЙ РЕКОРД!</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-green" id="btn-restart">&#8635; ЕЩЁ РАЗ</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-gold" id="btn-shop-from-over">🏪 МАГАЗИН</button>
      <button class="btn btn-gray" id="btn-menu-from-over">⏹ В МЕНЮ</button>
    </div>
  </div>
</div>

<!-- SHOP SCREEN -->
<div class="screen screen-bg" id="scr-shop">
  <div class="si">
    <div class="shop-header">
      <div class="shop-title">🏪 МАГАЗИН</div>
      <div class="shop-bal">💰 <span id="shop-bal">0</span></div>
    </div>
    <div id="shop-items"></div>
    <button class="btn btn-gray" id="btn-shop-close" style="margin-top:8px">✕ ЗАКРЫТЬ</button>
  </div>
</div>
<script>
'use strict';
// ═══════════════════════════════════════════════════════════════
// DINO 3D — Desert Runner  (Full Edition)
// ═══════════════════════════════════════════════════════════════

// ── Canvas ────────────────────────────────────────────────────
var canvas=$('c'), ctx=canvas.getContext('2d'), W=0, H=0;
function $(id){return document.getElementById(id);}
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize(); window.addEventListener('resize',resize);

// ── DOM ───────────────────────────────────────────────────────
var $score=$('score'), $hi=$('hi'), $coins=$('coins-hud');
var $overVal=$('over-val'), $overCoins=$('over-coins'), $newRec=$('new-rec');
var $scrStart=$('scr-start'), $scrOver=$('scr-over');
var $scrPause=$('scr-pause'), $scrShop=$('scr-shop');
var $tod=$('tod'), $todFill=$('tod-fill');
var $weather=$('weather-lbl');
var $shopItems=$('shop-items');

// ── Constants ─────────────────────────────────────────────────
var GF=0.70, DX=0.18, GRAV=0.70, JV1=16, JV2=13, SPEED=6;
var TOD_DUR=15000, WEA_DUR=30000;
var TOD_NAMES=['УТРО','ДЕНЬ','ВЕЧЕР','НОЧЬ'];
var WEA_NAMES=['ЯСНО','ДОЖДЬ','ПЕСЧАНАЯ БУРЯ','МОЛНИЯ','СНЕГ','ТУМАН'];
var TOD_BAR=['#ffcc66','#88ccff','#ff8844','#6688ff'];

// ── State ─────────────────────────────────────────────────────
var mode='idle'; // idle|play|dead|pause
var score=0, hiScore=0, frameN=0, gScroll=0, spawnCD=100, dustCD=0;
var coinTotal=0; // persisted across games
var coinsRun=0;  // coins in current run
var todPhase=0, todT=0, todStart=0;
var weaPhase=0, weaT=0, weaStart=0;
var dino={y:0,vy:0,jumps:0,runT:0,shakeTick:0};
var obstacles=[], particles=[], clouds=[], coins=[], coinSpawnCD=90;
var weatherParts=[]; // rain/snow/sand particles
var lightningTimer=0, lightningFlash=0;
var fogAlpha=0;
var activeSkin=0, activeHat=0;

// ── Audio (Web Audio API — no external files) ─────────────────
var AC=null;
function getAC(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}

function playTone(freq,dur,vol,type,decay){
  var ac=getAC(); if(!ac) return;
  try{
    var o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.type=type||'square';
    o.frequency.setValueAtTime(freq,ac.currentTime);
    g.gain.setValueAtTime((vol||0.15),ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+(dur||0.1));
    o.start(ac.currentTime); o.stop(ac.currentTime+(dur||0.1)+(decay||0));
  }catch(e){}
}

function playNoise(dur,vol,lpFreq){
  var ac=getAC(); if(!ac) return;
  try{
    var buf=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate);
    var d=buf.getChannelData(0);
    for(var i=0;i<d.length;i++) d[i]=(Math.random()*2-1);
    var src=ac.createBufferSource();
    src.buffer=buf;
    var flt=ac.createBiquadFilter();
    flt.type='lowpass'; flt.frequency.value=lpFreq||400;
    var g=ac.createGain();
    g.gain.setValueAtTime(vol||0.1,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
    src.connect(flt); flt.connect(g); g.connect(ac.destination);
    src.start(); src.stop(ac.currentTime+dur);
  }catch(e){}
}

function sndJump()   { playTone(220,0.15,0.2,'square'); playTone(330,0.1,0.1,'square'); }
function sndCoin()   { playTone(880,0.06,0.2,'sine'); playTone(1320,0.08,0.15,'sine'); }
function sndDie()    { playTone(150,0.3,0.25,'sawtooth'); playTone(80,0.4,0.2,'sawtooth'); }
function sndStep()   { playNoise(0.04,0.04,200); }
function sndRain()   { playNoise(0.08,0.03,600); }
function sndSand()   { playNoise(0.1,0.06,300); }
function sndLightning(){ playTone(60,0.08,0.3,'sawtooth'); playNoise(0.15,0.2,800); }
var stepTimer=0, rainTimer=0, sandTimer=0;

// ── Persistence ───────────────────────────────────────────────
function saveData(){
  try{localStorage.setItem('dino3d',JSON.stringify({hi:hiScore,coins:coinTotal,skin:activeSkin,hat:activeHat}));}catch(e){}
}
function loadData(){
  try{
    var d=JSON.parse(localStorage.getItem('dino3d')||'{}');
    hiScore=d.hi||0; coinTotal=d.coins||0; activeSkin=d.skin||0; activeHat=d.hat||0;
  }catch(e){}
}
loadData();

// ── Shop data ─────────────────────────────────────────────────
var SKINS=[
  {id:0,name:'Зелёный',price:0,   color:[28,188,62],  dark:[14,138,42]},
  {id:1,name:'Синий',  price:200, color:[28,120,220],  dark:[14,70,160]},
  {id:2,name:'Красный',price:300, color:[210,40,40],   dark:[150,20,20]},
  {id:3,name:'Золотой',price:500, color:[220,180,20],  dark:[160,120,10]},
  {id:4,name:'Фиолет', price:400, color:[140,40,220],  dark:[90,20,160]},
  {id:5,name:'Чёрный', price:600, color:[40,40,40],    dark:[20,20,20]},
];
var HATS=[
  {id:0,name:'Без шляпы',price:0,   draw:null},
  {id:1,name:'Ковбойская',price:150,draw:'cowboy'},
  {id:2,name:'Топ-хэт',  price:250,draw:'tophat'},
  {id:3,name:'Корона',   price:400,draw:'crown'},
  {id:4,name:'Санта',    price:350,draw:'santa'},
  {id:5,name:'Рыцарь',   price:450,draw:'knight'},
];

// ── Pre-baked data ────────────────────────────────────────────
var STARS=[];
for(var _i=0;_i<80;_i++)
  STARS.push({nx:Math.random(),ny:Math.random()*0.75,r:0.4+Math.random()*1.6,a:0.3+Math.random()*0.7,ph:Math.random()*Math.PI*2});
var PBX=[0.04,0.13,0.22,0.34,0.46,0.57,0.68,0.80,0.91];

// ── Time-of-day palettes ──────────────────────────────────────
var TPAL=[
  {skyTop:[80,40,20],skyMid:[200,110,50],skyBot:[240,180,90],gTop:[210,155,65],gBot:[140,95,35],sun:[255,230,130],sunA:0.7,sunB:0.3,dune1:[165,100,40],dune2:[140,80,30],starsA:0,cloudA:0.65,cloudC:[255,220,180]},
  {skyTop:[30,100,200],skyMid:[80,160,240],skyBot:[160,210,255],gTop:[215,165,70],gBot:[145,100,40],sun:[255,248,180],sunA:0.8,sunB:0.4,dune1:[175,115,45],dune2:[150,90,35],starsA:0,cloudA:0.75,cloudC:[255,255,255]},
  {skyTop:[20,10,40],skyMid:[160,55,15],skyBot:[240,120,30],gTop:[190,120,45],gBot:[120,72,25],sun:[255,160,40],sunA:0.6,sunB:0.25,dune1:[140,75,28],dune2:[115,55,18],starsA:0.3,cloudA:0.5,cloudC:[255,180,120]},
  {skyTop:[5,5,20],skyMid:[10,12,35],skyBot:[18,20,50],gTop:[55,40,20],gBot:[30,22,10],sun:[220,220,255],sunA:0.9,sunB:0.5,dune1:[45,32,15],dune2:[35,24,10],starsA:0.95,cloudA:0.2,cloudC:[150,160,200]}
];

// ── Utility ───────────────────────────────────────────────────
function clamp(v,lo,hi){return v<lo?lo:v>hi?hi:v;}
function lerp(a,b,t){return a+(b-a)*clamp(t,0,1);}
function fmt5(n){return String(Math.floor(Math.max(0,n))).padStart(5,'0');}
function lerpRGB(a,b,t){return[Math.round(lerp(a[0],b[0],t)),Math.round(lerp(a[1],b[1],t)),Math.round(lerp(a[2],b[2],t))];}
function rgb(c){return'rgb('+c[0]+','+c[1]+','+c[2]+')';}
function rgba(c,a){return'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}

function getPal(){
  var t=todT, A=TPAL[todPhase], B=TPAL[(todPhase+1)%4];
  return{skyTop:lerpRGB(A.skyTop,B.skyTop,t),skyMid:lerpRGB(A.skyMid,B.skyMid,t),
    skyBot:lerpRGB(A.skyBot,B.skyBot,t),gTop:lerpRGB(A.gTop,B.gTop,t),gBot:lerpRGB(A.gBot,B.gBot,t),
    sun:lerpRGB(A.sun,B.sun,t),sunA:lerp(A.sunA,B.sunA,t),sunB:lerp(A.sunB,B.sunB,t),
    dune1:lerpRGB(A.dune1,B.dune1,t),dune2:lerpRGB(A.dune2,B.dune2,t),
    starsA:lerp(A.starsA,B.starsA,t),cloudA:lerp(A.cloudA,B.cloudA,t),cloudC:lerpRGB(A.cloudC,B.cloudC,t)};
}

// ── Voxel block ───────────────────────────────────────────────
function vox(bx,by,bw,bh,dep,fr,tl,sd){
  tl=tl===undefined?44:tl; sd=sd===undefined?46:sd;
  var r=fr[0],g=fr[1],b=fr[2],sk=dep*0.5;
  ctx.fillStyle='rgb('+r+','+g+','+b+')';
  ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.lineWidth=0.5;
  ctx.strokeRect(bx+0.25,by+0.25,bw-0.5,bh-0.5);
  var rt=clamp(r+tl,0,255),gt=clamp(g+tl,0,255),bt=clamp(b+tl,0,255);
  ctx.fillStyle='rgb('+rt+','+gt+','+bt+')';
  ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx+bw,by);
  ctx.lineTo(bx+bw-sk,by-dep); ctx.lineTo(bx-sk,by-dep); ctx.closePath(); ctx.fill();
  var rs=clamp(r-sd,0,255),gs=clamp(g-sd,0,255),bs=clamp(b-sd,0,255);
  ctx.fillStyle='rgb('+rs+','+gs+','+bs+')';
  ctx.beginPath(); ctx.moveTo(bx+bw,by); ctx.lineTo(bx+bw,by+bh);
  ctx.lineTo(bx+bw-sk,by+bh-dep); ctx.lineTo(bx+bw-sk,by-dep); ctx.closePath(); ctx.fill();
}

// ── Background ────────────────────────────────────────────────
function drawBG(pal){
  var gY=H*GF;
  // weather overlay on sky colours
  var wOv=getWeatherOverlay();
  var sTop=wOv?lerpRGB(pal.skyTop,wOv.skyT,wOv.t):pal.skyTop;
  var sMid=wOv?lerpRGB(pal.skyMid,wOv.skyM,wOv.t):pal.skyMid;
  var sBot=wOv?lerpRGB(pal.skyBot,wOv.skyB,wOv.t):pal.skyBot;

  var sg=ctx.createLinearGradient(0,0,0,gY);
  sg.addColorStop(0,rgb(sTop)); sg.addColorStop(0.5,rgb(sMid)); sg.addColorStop(1,rgb(sBot));
  ctx.fillStyle=sg; ctx.fillRect(0,0,W,gY);

  if(pal.starsA>0.02){
    for(var i=0;i<STARS.length;i++){
      var s=STARS[i]; s.ph+=0.02;
      ctx.globalAlpha=s.a*pal.starsA*(0.6+0.4*Math.sin(s.ph));
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(s.nx*W,s.ny*gY,s.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  // Lightning flash
  if(lightningFlash>0){
    ctx.fillStyle='rgba(255,255,220,'+lightningFlash*0.55+')';
    ctx.fillRect(0,0,W,H);
    lightningFlash=Math.max(0,lightningFlash-0.07);
  }

  // Sun/Moon (hidden during heavy sand/fog)
  if(weaPhase!==2||weaT<0.7){
    var isMoon=(todPhase===3)||(todPhase===2&&todT>0.6);
    var sunX=isMoon?W*0.15:W*0.80, sunY=gY*0.18;
    var sunR=Math.min(W,H)*(isMoon?0.038:0.046);
    var glo=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,sunR*4);
    glo.addColorStop(0,rgba(pal.sun,pal.sunA)); glo.addColorStop(0.4,rgba(pal.sun,pal.sunB)); glo.addColorStop(1,rgba(pal.sun,0));
    ctx.fillStyle=glo; ctx.beginPath(); ctx.arc(sunX,sunY,sunR*4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=rgb(pal.sun); ctx.beginPath(); ctx.arc(sunX,sunY,sunR,0,Math.PI*2); ctx.fill();
    if(isMoon){
      ctx.fillStyle='rgba(0,0,0,0.15)';
      ctx.beginPath(); ctx.arc(sunX+sunR*0.3,sunY-sunR*0.2,sunR*0.22,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(sunX-sunR*0.3,sunY+sunR*0.3,sunR*0.14,0,Math.PI*2); ctx.fill();
    }
  }

  for(var ci=0;ci<clouds.length;ci++) drawCloud(clouds[ci],pal);

  var dOff=gScroll*0.12;
  for(var di=0;di<5;di++){
    var dx=((di*W*0.21-dOff)%(W*1.05)+W*1.05)%(W*1.05)-W*0.025;
    ctx.fillStyle=rgb(di%2?pal.dune2:pal.dune1);
    ctx.beginPath(); ctx.ellipse(dx,gY,W*(0.2+(di%3)*0.04),H*(0.065+(di%2)*0.025),0,Math.PI,Math.PI*2); ctx.fill();
  }

  var gg=ctx.createLinearGradient(0,gY,0,H);
  gg.addColorStop(0,rgb(pal.gTop)); gg.addColorStop(0.3,rgb(lerpRGB(pal.gTop,pal.gBot,0.5))); gg.addColorStop(1,rgb(pal.gBot));
  ctx.fillStyle=gg; ctx.fillRect(0,gY,W,H-gY);

  ctx.strokeStyle='rgba(255,220,120,0.18)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,gY); ctx.lineTo(W,gY); ctx.stroke();

  ctx.strokeStyle='rgba(0,0,0,0.12)'; ctx.lineWidth=1;
  var ls=W*0.12, lo=gScroll%ls;
  for(var x=-lo;x<W+ls;x+=ls){
    ctx.beginPath(); ctx.moveTo(x,gY+H*0.007);
    ctx.quadraticCurveTo(x+ls*0.28,gY+H*0.022,x+ls*0.52,gY+H*0.013); ctx.stroke();
  }
  for(var pi=0;pi<PBX.length;pi++){
    var px=((PBX[pi]*W+gScroll*(0.45+pi*0.06))%W+W)%W;
    var py=gY+H*0.009+(pi%4)*H*0.008, pr=1.5+pi%3;
    var lit=Math.round(lerp(38,20,pal.starsA));
    ctx.fillStyle='hsl('+(26+pi*4)+',45%,'+lit+'%)';
    ctx.beginPath(); ctx.ellipse(px,py,pr*1.4,pr*0.85,0,0,Math.PI*2); ctx.fill();
  }

  // Weather effects drawn ON TOP of BG
  drawWeatherFX();
}

function drawCloud(cl,pal){
  var r=18*cl.sc;
  ctx.globalAlpha=pal.cloudA;
  ctx.fillStyle=rgb(pal.cloudC);
  var pts=[[0,0,r],[-r*0.8,r*0.22,r*0.7],[r*0.8,r*0.22,r*0.7],[-r*0.36,-r*0.36,r*0.6],[r*0.36,-r*0.32,r*0.56]];
  for(var i=0;i<pts.length;i++){ctx.beginPath();ctx.arc(cl.x+pts[i][0],cl.y+pts[i][1],pts[i][2],0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
}

// ── Weather ───────────────────────────────────────────────────
var WEA_OVL=[
  null, // clear
  {skyT:[40,50,70],skyM:[60,70,90],skyB:[80,100,120]}, // rain
  {skyT:[120,90,40],skyM:[160,120,60],skyB:[200,150,80]}, // sandstorm
  {skyT:[20,20,50],skyM:[30,30,70],skyB:[50,50,100]}, // lightning
  {skyT:[140,160,180],skyM:[180,200,220],skyB:[210,225,240]}, // snow
  {skyT:[100,110,120],skyM:[130,140,150],skyB:[155,165,175]}, // fog
];

function getWeatherOverlay(){
  if(weaPhase===0) return null;
  var ov=WEA_OVL[weaPhase]; if(!ov) return null;
  var t2=clamp(weaT*3,0,1); // fade in quickly
  return{skyT:ov.skyT,skyM:ov.skyM,skyB:ov.skyB,t:t2};
}

function initWeatherParts(){
  weatherParts=[];
  var gY=H*GF;
  if(weaPhase===1){ // rain
    for(var i=0;i<120;i++)
      weatherParts.push({x:Math.random()*W,y:Math.random()*gY,spd:8+Math.random()*6,len:10+Math.random()*8,alpha:0.4+Math.random()*0.4});
  } else if(weaPhase===2){ // sand
    for(var i=0;i<200;i++)
      weatherParts.push({x:Math.random()*W,y:H*0.2+Math.random()*gY*0.9,spd:3+Math.random()*4,size:1+Math.random()*2,alpha:0.3+Math.random()*0.5});
  } else if(weaPhase===4){ // snow
    for(var i=0;i<100;i++)
      weatherParts.push({x:Math.random()*W,y:Math.random()*gY,spd:1+Math.random()*2,drift:Math.random()*2-1,size:2+Math.random()*3,alpha:0.6+Math.random()*0.4,ph:Math.random()*Math.PI*2});
  }
}

function tickWeatherParts(){
  var gY=H*GF;
  for(var i=0;i<weatherParts.length;i++){
    var p=weatherParts[i];
    if(weaPhase===1){p.y+=p.spd; if(p.y>gY){p.y=0;p.x=Math.random()*W;}}
    else if(weaPhase===2){p.x-=p.spd; if(p.x<-10){p.x=W+10;p.y=H*0.2+Math.random()*gY*0.9;}}
    else if(weaPhase===4){p.ph+=0.03;p.x+=Math.sin(p.ph)*0.5+p.drift*0.3;p.y+=p.spd;if(p.y>gY){p.y=0;p.x=Math.random()*W;}}
  }
}

function drawWeatherFX(){
  var gY=H*GF;
  var wStr=clamp(weaT*4,0,1);

  if(weaPhase===1&&wStr>0){ // Rain
    ctx.save();
    for(var i=0;i<weatherParts.length;i++){
      var p=weatherParts[i];
      ctx.globalAlpha=p.alpha*wStr;
      ctx.strokeStyle='#aad0ff';
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(p.x,p.y);
      ctx.lineTo(p.x-2,p.y+p.len);
      ctx.stroke();
    }
    ctx.restore();
    // Puddles on ground
    ctx.globalAlpha=0.18*wStr;
    ctx.fillStyle='#8ab8e0';
    var pudW=W*0.08;
    for(var i=0;i<5;i++){
      var px2=((i*W*0.2+gScroll*0.3)%W+W)%W;
      ctx.beginPath(); ctx.ellipse(px2,gY+3,pudW*(0.5+i%3*0.2),4,0,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  if(weaPhase===2&&wStr>0){ // Sand storm
    ctx.save();
    for(var i=0;i<weatherParts.length;i++){
      var p=weatherParts[i];
      ctx.globalAlpha=p.alpha*wStr;
      ctx.fillStyle='hsl(32,70%,60%)';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    }
    // Big sand overlay
    var sandGrad=ctx.createLinearGradient(0,gY*0.2,W,gY);
    sandGrad.addColorStop(0,'rgba(200,150,60,0)');
    sandGrad.addColorStop(1,'rgba(200,150,60,'+(0.38*wStr)+')');
    ctx.fillStyle=sandGrad; ctx.globalAlpha=1;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }

  if(weaPhase===3&&wStr>0){ // Lightning bolts drawn separately
    lightningTimer++;
    if(lightningTimer>Math.max(15,60-Math.floor(weaT*30))){
      lightningTimer=0;
      lightningFlash=1;
      drawLightningBolt();
      sndLightning();
    }
  }

  if(weaPhase===4&&wStr>0){ // Snow
    ctx.save();
    for(var i=0;i<weatherParts.length;i++){
      var p=weatherParts[i];
      ctx.globalAlpha=p.alpha*wStr;
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
    // Snow on ground
    ctx.globalAlpha=0.55*wStr;
    ctx.fillStyle='#eef4ff';
    ctx.fillRect(0,gY,W,H*0.015);
    ctx.globalAlpha=1;
  }

  if(weaPhase===5&&wStr>0){ // Fog
    fogAlpha=lerp(fogAlpha,0.55*wStr,0.02);
    var fogGrad=ctx.createLinearGradient(0,0,0,H);
    fogGrad.addColorStop(0,'rgba(180,190,200,'+fogAlpha*0.6+')');
    fogGrad.addColorStop(0.5,'rgba(180,190,200,'+fogAlpha+')');
    fogGrad.addColorStop(1,'rgba(180,190,200,'+fogAlpha*0.4+')');
    ctx.fillStyle=fogGrad;
    ctx.fillRect(0,0,W,H);
  } else {
    fogAlpha=Math.max(0,fogAlpha-0.01);
    if(fogAlpha>0){
      ctx.fillStyle='rgba(180,190,200,'+fogAlpha+')';
      ctx.fillRect(0,0,W,H);
    }
  }
}

function drawLightningBolt(){
  var gY=H*GF;
  var x=W*(0.2+Math.random()*0.6), y0=0, y1=gY;
  ctx.save();
  ctx.strokeStyle='rgba(255,255,180,0.95)';
  ctx.lineWidth=2+Math.random()*2;
  ctx.shadowColor='#fff8a0';
  ctx.shadowBlur=18;
  ctx.beginPath();
  ctx.moveTo(x,y0);
  var segs=6+Math.floor(Math.random()*4);
  for(var i=1;i<=segs;i++){
    var ty=lerp(y0,y1,i/segs);
    var tx=x+(Math.random()-0.5)*80;
    ctx.lineTo(tx,ty); x=tx;
  }
  ctx.stroke();
  // branch
  ctx.lineWidth=1;
  ctx.globalAlpha=0.6;
  ctx.beginPath();
  ctx.moveTo(x,gY*0.4);
  ctx.lineTo(x+30+Math.random()*40,gY*0.4+40+Math.random()*40);
  ctx.stroke();
  ctx.restore();
}

  var scale=DINO_SCREEN_H/spH;
  var dw=Math.round(spW*scale),dh=DINO_SCREEN_H;
  if(!_skinOC){_skinOC=document.createElement('canvas');}
  _skinOC.width=dw; _skinOC.height=dh;
  var oc=_skinOC.getContext('2d');
  oc.clearRect(0,0,dw,dh);
  oc.imageSmoothingEnabled=true;
  oc.drawImage(img,0,0,spW,spH,0,0,dw,dh);
  if(activeSkin!==0){
    var id=oc.getImageData(0,0,dw,dh),d=id.data;
    for(var i=0;i<d.length;i+=4){
      if(d[i+3]>20&&d[i+1]>d[i]&&d[i+1]>d[i+2]&&d[i+1]>60){
        var bright=d[i+1]/160;
        d[i]=Math.min(255,Math.round(sc[0]*bright));
        d[i+1]=Math.min(255,Math.round(sc[1]*bright));
        d[i+2]=Math.min(255,Math.round(sc[2]*bright));
      }
    }
    oc.putImageData(id,0,0);
  }
  return{canvas:_skinOC,w:dw,h:dh};
}

function getSkinColors(){var sk=SKINS[activeSkin]||SKINS[0];return{G0:sk.color,G2:sk.dark};}
function DS(){return DINO_SCREEN_H/(_runH[0]||160);}

function drawDino(sx,sy,runT,air,dead){
  var gY=H*GF;
  var isJump=air&&!dead;
  var fi;
  if(dead){fi=0;isJump=false;}
  else if(isJump){fi=Math.floor((frameN||0)/7)%_jumpImgs.length;}
  else{fi=Math.floor((frameN||0)/7)%_runImgs.length;}
  var fr=getSkinnedFrame(fi,isJump);
  var dw=fr.w,dh=fr.h;
  var drawX=Math.round(sx-dw/2);
  var drawY=Math.round(sy-dh);
  // Тень
  ctx.globalAlpha=air?0.07:0.16;
  ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(sx,gY+2,air?dw*0.25:dw*0.42,4,0,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
  // Дино
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(fr.canvas,0,0,dw,dh,drawX,drawY,dw,dh);
  // X при смерти
  if(dead){
    var ex=drawX+Math.round(dw*0.62),ey=drawY+Math.round(dh*0.10),es=Math.round(dh*0.08);
    ctx.strokeStyle='#ff2200';ctx.lineWidth=Math.max(2,es*0.5);ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex+es,ey+es);
    ctx.moveTo(ex+es,ey);ctx.lineTo(ex,ey+es);ctx.stroke();ctx.lineCap='butt';
  }
  drawHat(sx,sy,dw,dh,air);
}

function drawHat(sx,sy,dw,dh,air){
  var hat=HATS[activeHat];if(!hat||!hat.draw)return;
  var drawX=sx-dw/2,drawY=sy-dh;
  var hx=drawX+dw*0.68,hy=drawY+dh*0.04+Math.sin((frameN||0)*0.15)*1.5;
  ctx.save();var u=dh/18;
  if(hat.draw==='cowboy'){
    ctx.fillStyle='#8B4513';ctx.fillRect(hx-u*4,hy+u*2,u*8,u*1.2);
    ctx.fillStyle='rgb(160,100,50)';ctx.fillRect(hx-u*3,hy-u*0.5,u*6,u*2.8);
    ctx.fillStyle='#3a1500';ctx.fillRect(hx-u*3,hy+u*1.6,u*6,u*0.5);
  }else if(hat.draw==='tophat'){
    ctx.fillStyle='#111';ctx.fillRect(hx-u*4,hy+u*1.2,u*8,u*1.2);
    ctx.fillRect(hx-u*2.5,hy-u*3,u*5,u*4.2);
    ctx.fillStyle='#c0392b';ctx.fillRect(hx-u*2.5,hy+u*0.8,u*5,u*0.5);
  }else if(hat.draw==='crown'){
    ctx.fillStyle='#FFD700';
    var pts=[[hx-u*3.5,hy+u],[hx-u*3.5,hy-u*2.5],[hx-u*1.2,hy-u*0.5],[hx,hy-u*3.5],[hx+u*1.2,hy-u*0.5],[hx+u*3.5,hy-u*2.5],[hx+u*3.5,hy+u]];
    ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
    for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='#b8860b';ctx.lineWidth=u*0.4;ctx.stroke();
    ctx.fillStyle='#f44';ctx.beginPath();ctx.arc(hx,hy-u*3,u*0.6,0,Math.PI*2);ctx.fill();
  }else if(hat.draw==='santa'){
    ctx.fillStyle='#eee';ctx.fillRect(hx-u*3.5,hy+u*0.8,u*7,u*1.2);
    ctx.fillStyle='#cc1111';
    ctx.beginPath();ctx.moveTo(hx-u*3,hy+u);ctx.lineTo(hx+u*3,hy+u);ctx.lineTo(hx+u*0.5,hy-u*5);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(hx+u*0.5,hy-u*5,u*0.9,0,Math.PI*2);ctx.fill();
  }else if(hat.draw==='knight'){
    ctx.fillStyle='rgb(155,160,170)';ctx.fillRect(hx-u*3,hy-u*5,u*6,u*6);
    ctx.fillRect(hx-u*3.5,hy+u,u*7,u*1.5);
    ctx.fillStyle='#111';ctx.fillRect(hx-u*1.8,hy-u*1.2,u*3.6,u);
    ctx.fillStyle='#cc2222';ctx.fillRect(hx-u*0.6,hy-u*7,u*1.2,u*3);
  }
  ctx.restore();
}

function spawnCoin(){
  var gY=H*GF;
  var yOff=Math.random()<0.4?H*0.12+Math.random()*H*0.1:0; // some coins floating
  coins.push({x:W+40, y:gY-yOff-DINO_SCREEN_H*0.45, r:Math.round(DINO_SCREEN_H*0.14), collected:false, anim:0});
}

function drawCoins(){
  var t=frameN*0.06;
  for(var i=0;i<coins.length;i++){
    var c=coins[i];
    if(c.collected) continue;
    var bob=Math.sin(t+i)*4;
    var cx=c.x, cy=c.y+bob;
    var r=c.r;
    // Glow
    ctx.globalAlpha=0.35;
    ctx.fillStyle='#ffe000';
    ctx.beginPath(); ctx.arc(cx,cy,r*1.55,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
    // Coin body
    ctx.fillStyle='#FFD700';
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#FFA500';
    ctx.beginPath(); ctx.arc(cx,cy,r*0.78,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#FFD700';
    ctx.font='bold '+Math.round(r*1.1)+'px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('$',cx,cy+1);
  }
  ctx.globalAlpha=1;
}

function tickCoins(){
  var sx=W*DX, gY=H*GF;
  var S=DS(), sy=gY-dino.y;
  for(var i=coins.length-1;i>=0;i--){
    var c=coins[i];
    c.x-=SPEED;
    if(!c.collected){
      // coin box — use dinoBox for accurate detection
      var db2=dinoBox();
      var coinR=c.r*1.1;
      if(c.x+coinR>db2.x&&c.x-coinR<db2.x+db2.w&&c.y+coinR>db2.y&&c.y-coinR<db2.y+db2.h){
        c.collected=true;
        coinsRun++;
        coinTotal++;
        saveData();
        sndCoin();
        // Burst particles
        for(var j=0;j<8;j++)
          particles.push({x:c.x,y:c.y,vx:(Math.random()-0.5)*5,vy:-(1+Math.random()*3),life:1,size:3+Math.random()*3,hue:50});
        $coins.textContent=coinTotal;
      }
    }
    if(c.x<-60) coins.splice(i,1);
  }

  coinSpawnCD--;
  if(coinSpawnCD<=0){
    spawnCoin();
    coinSpawnCD=Math.max(40,80+Math.random()*50);
  }
}

function drawCactus(obs){
  var cx=obs.x, H_c=obs.h, type=obs.type%_cacImgs.length;
  var gY=H*GF;
  var img=_cacImgs[type]; if(!img)return;
  var spW=_cacW[type],spH=_cacH[type];
  var dh=Math.round(H_c);
  var dw=Math.round(dh*spW/spH);
  // Кактусы рисуются ТОЧНО на линии земли (gY = низ кактуса)
  var drawY=Math.round(gY-dh);  // верх кактуса
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(img,0,0,spW,spH,Math.round(cx-dw/2),drawY,dw,dh);
}

// ── Collision ─────────────────────────────────────────────────
function getDinoScreenSize(){
  var spH=_runH[0]||160, scale=DINO_SCREEN_H/spH, spW=_runW[0]||141;
  return{w:Math.round(spW*scale),h:DINO_SCREEN_H};
}
function dinoBoxes(){
  var gY=H*GF,sx=W*DX,sy=gY-dino.y;
  var sz=getDinoScreenSize(),dw=sz.w,dh=sz.h;
  var drawX=sx-dw/2,drawY=sy-dh;
  var body={x:drawX+dw*0.05,y:drawY+dh*0.30,w:dw*0.50,h:dh*0.48};
  var head={x:drawX+dw*0.38,y:drawY+dh*0.02,w:dw*0.58,h:dh*0.32};
  return[body,head];
}
function dinoBox(){
  var gY=H*GF,sx=W*DX,sy=gY-dino.y;
  var sz=getDinoScreenSize();
  return{x:sx-sz.w/2,y:sy-sz.h,w:sz.w,h:sz.h};
}
function cactusBox(obs){
  var gY=H*GF,type=obs.type%(_cacImgs.length||5);
  var spW=_cacW[type]||120,spH=_cacH[type]||200;
  var dh=Math.round(obs.h),dw=Math.round(dh*spW/spH);
  return{x:obs.x-dw*0.38,y:gY-dh*0.96,w:dw*0.76,h:dh*0.94};
}
function boxOverlap(a,b){
  return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}
function overlaps(a,b){return boxOverlap(a,b);}
function dinoHitsCactus(obs){
  var cb=cactusBox(obs),boxes=dinoBoxes();
  for(var i=0;i<boxes.length;i++)if(boxOverlap(boxes[i],cb))return true;
  return false;
}

// ── Particles ─────────────────────────────────────────────────
function addDust(x,y){
  if(Math.random()>0.55)return;
  for(var i=0;i<3;i++)
    particles.push({x:x,y:y,vx:-(0.4+Math.random()*1.2)*SPEED*0.5,vy:-(0.15+Math.random()*1.4),life:1,size:1.5+Math.random()*3.5,hue:24+Math.random()*16});
}
function deathBurst(x,y){
  for(var i=0;i<22;i++){
    var a=(i/22)*Math.PI*2,s=2+Math.random()*5;
    particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3.5,life:1,size:3+Math.random()*5,hue:Math.random()<0.5?120:50});
  }
}
function tickParts(){
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.09;p.life-=0.033;
    if(p.life<=0)particles.splice(i,1);
  }
}
function drawParts(){
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    ctx.globalAlpha=p.life*0.62;
    ctx.fillStyle='hsl('+p.hue+',65%,58%)';
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

// ── Clouds ────────────────────────────────────────────────────
function makeCloud(off){
  return{x:off?W+60+Math.random()*180:Math.random()*W,y:H*GF*(0.08+Math.random()*0.32),sc:0.55+Math.random()*0.9,spd:0.25+Math.random()*0.38};
}

// ── TOD & Weather update ──────────────────────────────────────
function updateTOD(now){
  var el=now-todStart;
  todT=clamp(el/TOD_DUR,0,1);
  if(el>=TOD_DUR){todPhase=(todPhase+1)%4;todStart=now;todT=0;}
  $tod.textContent=TOD_NAMES[todPhase];
  $todFill.style.width=(todT*100).toFixed(1)+'%';
  $todFill.style.background=TOD_BAR[todPhase];
}

function updateWeather(now){
  var el=now-weaStart;
  weaT=clamp(el/WEA_DUR,0,1);
  if(el>=WEA_DUR){
    // next weather (skip clear sometimes)
    var next=(weaPhase+1)%6;
    setWeather(next,now);
  }
  $weather.textContent=WEA_NAMES[weaPhase];

  // ambient sounds
  rainTimer++; sandTimer++;
  if(weaPhase===1&&rainTimer%22===0) sndRain();
  if(weaPhase===2&&sandTimer%18===0) sndSand();
}

function setWeather(phase,now){
  weaPhase=phase; weaStart=now; weaT=0; lightningTimer=0;
  initWeatherParts();
}

// ── Game flow ─────────────────────────────────────────────────
function startGame(){
  mode='play'; score=0; coinsRun=0; frameN=0; gScroll=0;
  spawnCD=100; dustCD=0; coinSpawnCD=90;
  dino.y=0; dino.vy=0; dino.jumps=0; dino.runT=0; dino.shakeTick=0;
  obstacles=[]; particles=[]; coins=[];
  clouds=[]; for(var i=0;i<6;i++) clouds.push(makeCloud(false));
  todPhase=0; todT=0; todStart=performance.now();
  $coins.textContent=coinTotal;
  $('btn-pause').style.display='block';
  var now=performance.now();
  weaPhase=0; weaT=0; weaStart=now; weatherParts=[]; lightningFlash=0; fogAlpha=0;
  $scrStart.classList.remove('on');
  $scrOver.classList.remove('on');
  $scrPause.classList.remove('on');
}

function pauseGame(){
  if(mode==='play'){mode='pause';$scrPause.classList.add('on');}
}
function resumeGame(){
  if(mode==='pause'){
    // Re-sync timers to avoid time jumps
    var now=performance.now();
    var todElapsed=todT*TOD_DUR; todStart=now-todElapsed;
    var weaElapsed=weaT*WEA_DUR; weaStart=now-weaElapsed;
    mode='play'; $scrPause.classList.remove('on');
  }
}
function goMenu(){
  mode='idle';
  $('btn-pause').style.display='none';
  $scrPause.classList.remove('on');
  $scrOver.classList.remove('on');
  $scrStart.classList.add('on');
}

function doJump(){
  if(mode==='play'){
    if(dino.jumps===0){dino.vy=JV1;dino.jumps=1;sndJump();}
    else if(dino.jumps===1){dino.vy=JV2;dino.jumps=2;sndJump();
      var gY=H*GF,sx=W*DX;
      for(var i=0;i<6;i++) particles.push({x:sx,y:gY-dino.y,vx:(Math.random()-0.5)*4,vy:1+Math.random()*2,life:1,size:2+Math.random()*3,hue:120});
    }
  } else if(mode==='pause'){resumeGame();}
}

function die(){
  if(mode!=='play')return;
  mode='dead';
  sndDie();
  if(score>hiScore){hiScore=score;saveData();}
  deathBurst(W*DX,H*GF-dino.y-DS()*0.8);
  setTimeout(function(){
    $overVal.textContent=fmt5(score);
    $overCoins.textContent='+'+coinsRun+' монет';
    $newRec.style.display=(score>0&&score>=hiScore)?'flex':'none';
    $scrOver.classList.add('on');
  },850);
}

// ── Update ────────────────────────────────────────────────────
function update(now){
  frameN++;
  gScroll+=SPEED;

  for(var ci=0;ci<clouds.length;ci++){
    var cl=clouds[ci]; cl.x-=cl.spd+SPEED*0.07;
    if(cl.x<-120) clouds[ci]=makeCloud(true);
  }

  dino.vy-=GRAV; dino.y+=dino.vy;
  if(dino.y<=0){dino.y=0;dino.vy=0;dino.jumps=0;}
  dino.runT+=SPEED*0.082;

  // Foot sounds & dust
  dustCD++;
  var S=DS();
  if(dino.y===0){
    if(dustCD%8===0) addDust(W*DX+S*0.1,H*GF-S*0.04);
    stepTimer++;
    if(stepTimer%14===0) sndStep();
  }

  // Spawn obstacles
  spawnCD--;
  if(spawnCD<=0){
    obstacles.push({x:W+60,h:H*(0.11+Math.random()*0.10),type:Math.floor(Math.random()*5)});
    spawnCD=Math.max(55,115-frameN*0.008)+Math.random()*55;
  }

  // Move obstacles + collision
  for(var oi=obstacles.length-1;oi>=0;oi--){
    var obs=obstacles[oi]; obs.x-=SPEED;
    if(dinoHitsCactus(obs)){die();return;}
    if(obs.x<-200) obstacles.splice(oi,1);
  }

  // Coins
  tickCoins();

  // Score
  score+=SPEED*0.06;
  $score.textContent=fmt5(score);
  $hi.textContent=fmt5(Math.max(hiScore,score));

  updateTOD(now);
  updateWeather(now);
  tickWeatherParts();
  tickParts();
}

// ── Draw ──────────────────────────────────────────────────────
function draw(){
  var gY=H*GF,sx=W*DX,S=DS();
  var sy=gY-dino.y;
  var pal=getPal();
  drawBG(pal);

  // Coins behind obstacles/dino
  drawCoins();

  for(var i=0;i<obstacles.length;i++){if(obstacles[i].x<sx-S*0.4)drawCactus(obstacles[i]);}

  var shk=0;
  if(mode==='dead'){dino.shakeTick++;shk=Math.sin(dino.shakeTick*1.85)*5*Math.max(0,1-dino.shakeTick/26);}
  drawDino(sx+shk,sy,dino.runT,dino.y>1,mode==='dead');

  for(var j=0;j<obstacles.length;j++){if(obstacles[j].x>=sx-S*0.4)drawCactus(obstacles[j]);}

  drawParts();
}

// ── Shop ──────────────────────────────────────────────────────
function openShop(){
  $('shop-bal').textContent=coinTotal;
  buildShopUI();
  // Hide all other screens so they don't bleed through
  $scrStart.classList.remove('on');
  $scrOver.classList.remove('on');
  $scrPause.classList.remove('on');
  $scrShop.classList.add('on');
}
function closeShopAndReturn(){
  $scrShop.classList.remove('on');
  // Return to correct screen
  if(mode==='idle') $scrStart.classList.add('on');
  else if(mode==='pause') $scrPause.classList.add('on');
  else if(mode==='dead') $scrOver.classList.add('on');
}
function closeShop(){
  $scrShop.classList.remove('on');
}

function buildShopUI(){
  var html='';
  html+='<div class="shop-section"><div class="shop-sec-title">🦎 СКИНЫ</div><div class="shop-grid">';
  for(var i=0;i<SKINS.length;i++){
    var sk=SKINS[i];
    var owned=coinTotal>=sk.price||sk.price===0;
    var active=activeSkin===i;
    var cls='shop-item'+(active?' active':'')+(owned?'':' locked');
    html+='<div class="'+cls+'" onclick="buySkin('+i+')">'+
      '<canvas class="si-canvas" id="skin-canvas-'+i+'" width="80" height="80"></canvas>'+
      '<div class="si-name">'+sk.name+'</div>'+
      '<div class="si-price">'+(sk.price===0?'БЕСПЛАТНО':(active?'✓ ВЫБРАН':(owned?'✓ КУПЛЕН':sk.price+' 💰')))+'</div>'+
      '</div>';
  }
  html+='</div></div>';
  html+='<div class="shop-section"><div class="shop-sec-title">🎩 ШЛЯПЫ</div><div class="shop-grid">';
  for(var i=0;i<HATS.length;i++){
    var ht=HATS[i];
    var owned2=coinTotal>=ht.price||ht.price===0;
    var active2=activeHat===i;
    var cls2='shop-item'+(active2?' active':'')+(owned2?'':' locked');
    html+='<div class="'+cls2+'" onclick="buyHat('+i+')">'+
      '<canvas class="si-canvas" id="hat-canvas-'+i+'" width="80" height="80"></canvas>'+
      '<div class="si-name">'+ht.name+'</div>'+
      '<div class="si-price">'+(ht.price===0?'БЕСПЛАТНО':(active2?'✓ ВЫБРАНА':(owned2?'✓ КУПЛЕНА':ht.price+' 💰')))+'</div>'+
      '</div>';
  }
  html+='</div></div>';
  $shopItems.innerHTML=html;
  // Render dino previews on canvases
  setTimeout(renderShopPreviews,10);
}

function renderShopPreviews(){
  var PW=80,PH=80;
  // Skin previews
  for(var i=0;i<SKINS.length;i++){
    var el=document.getElementById('skin-canvas-'+i);
    if(!el) continue;
    var pc=el.getContext('2d');
    pc.clearRect(0,0,PW,PH);
    pc.fillStyle='#1a1a2e';
    pc.fillRect(0,0,PW,PH);
    drawDinoPreview(pc,PW,PH,SKINS[i].color,SKINS[i].dark,null);
  }
  // Hat previews
  for(var j=0;j<HATS.length;j++){
    var el2=document.getElementById('hat-canvas-'+j);
    if(!el2) continue;
    var pc2=el2.getContext('2d');
    pc2.clearRect(0,0,PW,PH);
    pc2.fillStyle='#1a1a2e';
    pc2.fillRect(0,0,PW,PH);
    var skinC=SKINS[activeSkin]||SKINS[0];
    drawDinoPreview(pc2,PW,PH,skinC.color,skinC.dark,HATS[j]);
  }
}

function drawDinoPreview(pc,PW,PH,G0,G2,hat){
  pc.clearRect(0,0,PW,PH);
  pc.fillStyle='#1a1a2e';
  pc.fillRect(0,0,PW,PH);
  var img=_runImgs[0];if(!img)return;
  var spW=_runW[0],spH=_runH[0];
  var scale=PH*0.82/spH;
  var dw=Math.round(spW*scale),dh=Math.round(spH*scale);
  var dx=Math.round((PW-dw)*0.25),dy=Math.round((PH-dh)*0.08);
  var oc=document.createElement('canvas');oc.width=dw;oc.height=dh;
  var octx=oc.getContext('2d');
  octx.imageSmoothingEnabled=true;
  octx.drawImage(img,0,0,spW,spH,0,0,dw,dh);
  if(G0[0]!==52||G0[1]!==168){
    var id=octx.getImageData(0,0,dw,dh),d=id.data;
    for(var i=0;i<d.length;i+=4){
      if(d[i+3]>20&&d[i+1]>d[i]&&d[i+1]>d[i+2]&&d[i+1]>60){
        var bright=d[i+1]/160;
        d[i]=Math.min(255,Math.round(G0[0]*bright));
        d[i+1]=Math.min(255,Math.round(G0[1]*bright));
        d[i+2]=Math.min(255,Math.round(G0[2]*bright));
      }
    }
    octx.putImageData(id,0,0);
  }
  pc.imageSmoothingEnabled=true;
  pc.drawImage(oc,0,0,dw,dh,dx,dy,dw,dh);
  if(hat&&hat.draw){
    var hx=dx+dw*0.68,hy=dy,u=dh/18;
    drawPreviewHat(pc,hx,hy,u,hat);
  }
}
function drawPreviewHat(pc,hx,hy,u,hat){
  pc.save();
  if(hat.draw==='cowboy'){
    pc.fillStyle='#8B4513';pc.fillRect(hx-u*4,hy+u*2,u*8,u*1.2);
    pc.fillStyle='rgb(160,100,50)';pc.fillRect(hx-u*3,hy-u*0.5,u*6,u*2.8);
    pc.fillStyle='#3a1500';pc.fillRect(hx-u*3,hy+u*1.6,u*6,u*0.5);
  }else if(hat.draw==='tophat'){
    pc.fillStyle='#111';pc.fillRect(hx-u*4,hy+u*1.2,u*8,u*1.2);
    pc.fillRect(hx-u*2.5,hy-u*3,u*5,u*4.2);
    pc.fillStyle='#c0392b';pc.fillRect(hx-u*2.5,hy+u*0.8,u*5,u*0.5);
  }else if(hat.draw==='crown'){
    pc.fillStyle='#FFD700';
    var pts=[[hx-u*3.5,hy+u],[hx-u*3.5,hy-u*2.5],[hx-u*1.2,hy-u*0.5],[hx,hy-u*3.5],[hx+u*1.2,hy-u*0.5],[hx+u*3.5,hy-u*2.5],[hx+u*3.5,hy+u]];
    pc.beginPath();pc.moveTo(pts[0][0],pts[0][1]);
    for(var i=1;i<pts.length;i++)pc.lineTo(pts[i][0],pts[i][1]);
    pc.closePath();pc.fill();
  }else if(hat.draw==='santa'){
    pc.fillStyle='#eee';pc.fillRect(hx-u*3.5,hy+u*0.8,u*7,u*1.2);
    pc.fillStyle='#cc1111';
    pc.beginPath();pc.moveTo(hx-u*3,hy+u);pc.lineTo(hx+u*3,hy+u);pc.lineTo(hx+u*0.5,hy-u*5);pc.closePath();pc.fill();
    pc.fillStyle='#fff';pc.beginPath();pc.arc(hx+u*0.5,hy-u*5,u*0.9,0,Math.PI*2);pc.fill();
  }else if(hat.draw==='knight'){
    pc.fillStyle='rgb(155,160,170)';pc.fillRect(hx-u*3,hy-u*5,u*6,u*6);
    pc.fillStyle='#111';pc.fillRect(hx-u*1.8,hy-u*1.2,u*3.6,u);
    pc.fillStyle='#cc2222';pc.fillRect(hx-u*0.6,hy-u*7,u*1.2,u*3);
  }
  pc.restore();
}
window.buySkin=function buySkin(id){
  var sk=SKINS[id];
  if(!sk) return;
  if(sk.price>0&&coinTotal<sk.price&&activeSkin!==id){
    // Not enough coins — flash
    return;
  }
  activeSkin=id;
  saveData();
  buildShopUI();
}
window.buyHat=function buyHat(id){
  var ht=HATS[id];
  if(!ht) return;
  if(ht.price>0&&coinTotal<ht.price&&activeHat!==id){return;}
  activeHat=id;
  saveData();
  buildShopUI();
}

// ── Main loop ─────────────────────────────────────────────────
function loop(now){
  ctx.clearRect(0,0,W,H);
  if(mode==='play'||mode==='dead'){
    if(mode==='play') update(now);
    draw();
  } else {
    var pal=getPal();
    drawBG(pal);
    drawDino(W*DX,H*GF,0,false,false);
  }
  requestAnimationFrame(loop);
}

// ── Input ─────────────────────────────────────────────────────
document.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();doJump();}
  if(e.code==='Escape'||e.code==='KeyP'){if(mode==='play')pauseGame();else if(mode==='pause')resumeGame();}
});
canvas.addEventListener('touchstart',function(e){e.preventDefault();doJump();},{passive:false});
canvas.addEventListener('mousedown',function(e){
  // Only jump if not clicking a button
  if(e.target===canvas) doJump();
});
$('btn-start').addEventListener('click',function(e){e.stopPropagation();startGame();});
$('btn-restart').addEventListener('click',function(e){e.stopPropagation();startGame();});
$('btn-menu-from-over').addEventListener('click',function(e){e.stopPropagation();goMenu();});

$('btn-resume').addEventListener('click',function(e){e.stopPropagation();resumeGame();});
$('btn-menu-from-pause').addEventListener('click',function(e){e.stopPropagation();goMenu();});
$('btn-shop').addEventListener('click',function(e){e.stopPropagation();openShop();});
$('btn-shop-pause').addEventListener('click',function(e){e.stopPropagation();openShop();});
$('btn-shop-close').addEventListener('click',function(e){e.stopPropagation();closeShopAndReturn();});
$('btn-shop-from-over').addEventListener('click',function(e){e.stopPropagation();goMenu();openShop();});

todStart=performance.now();
weaStart=performance.now();
clouds=[]; for(var _ci=0;_ci<6;_ci++) clouds.push(makeCloud(false));
$coins.textContent=coinTotal;
$hi.textContent=fmt5(hiScore);
requestAnimationFrame(loop);
